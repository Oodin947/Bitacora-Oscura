<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; worker-src 'self' blob: https://cdnjs.cloudflare.com; connect-src 'self' blob: https://cdnjs.cloudflare.com; object-src 'none'; base-uri 'self';"
    />
    <title>Bitácora Oscura — Archivo Editorial</title>

    <!-- Editorial Typography: Instrument Serif + Inter + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Styles -->
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/layout.css" />
    <link rel="stylesheet" href="./styles/components.css" />

    <!-- Mozilla PDF.js for Dark Canvas PDF Rendering -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
      defer
    ></script>
  </head>
  <body>
    <!-- Subtle Paper Grain Texture -->
    <div class="grain-overlay" aria-hidden="true"></div>

    <!-- 2px Reading Progress Bar -->
    <div class="reading-progress" aria-hidden="true">
      <div class="reading-progress__bar" id="reading-progress-bar"></div>
    </div>

    <!-- Custom Magnetic Context Cursor Pill (Desktop) -->
    <div class="cursor-pill" id="cursor-pill" aria-hidden="true">Leer</div>

    <!-- Floating Minimalist Header -->
    <header class="site-header">
      <div class="container site-header__inner">
        <a href="#" class="brand glass-card" id="brand-home" data-cursor="Inicio" aria-label="Inicio">
          <span class="brand__emblem">
            <img src="./assets/logo-bitacora-oscura.jpg" alt="Bitácora Oscura" class="brand__logo" />
          </span>
          <span class="brand__text">
            <span class="brand__name">Bitácora Oscura</span>
            <span class="brand__sub">Diseño · Código · Capacitación</span>
          </span>
        </a>

        <nav class="site-nav" aria-label="Navegación principal">
          <a href="#quienes-somos" class="site-nav__link" id="nav-about">Quiénes somos</a>
          <a href="#archivo-section" class="site-nav__link" data-nav-filter="essay">Blog</a>
          <a href="#archivo-section" class="site-nav__link is-active" data-nav-filter="all">News</a>
          <a href="#archivo-section" class="site-nav__link" data-nav-filter="video">Tutoriales</a>
          <a href="#archivo-section" class="site-nav__link" data-nav-filter="pdf">Documentos</a>
        </nav>

        <button class="btn-glass mobile-menu-btn" id="mobile-menu-btn" type="button" aria-label="Abrir menú" aria-expanded="false">
          Menú
        </button>
      </div>

      <nav class="mobile-nav-drawer is-hidden" id="mobile-nav-drawer" aria-label="Navegación móvil">
        <a href="#quienes-somos" class="mobile-nav__link" data-mobile-about>Quiénes somos</a>
        <a href="#archivo-section" class="mobile-nav__link" data-nav-filter="essay">Blog</a>
        <a href="#archivo-section" class="mobile-nav__link is-active" data-nav-filter="all">News</a>
        <a href="#archivo-section" class="mobile-nav__link" data-nav-filter="video">Tutoriales</a>
        <a href="#archivo-section" class="mobile-nav__link" data-nav-filter="pdf">Documentos</a>
      </nav>
    </header>

    <!-- Main Content -->
    <main class="container main-content">
      <!-- Feed View -->
      <div id="feed-view">
        <section class="hero-editorial" id="hero-editorial" aria-label="Artículo destacado y bitácora"></section>

        <section id="archivo-section" aria-label="News y archivo multimedia">
          <div class="section-bar">
            <h2 class="section-bar__title">News</h2>
            <div class="filter-pills" id="filter-pills"></div>
          </div>
          <div class="bento-grid" id="bento-grid"></div>
        </section>
      </div>

      <!-- Dedicated Quiénes Somos View -->
      <section class="about-editorial post-view is-hidden" id="quienes-somos" aria-label="Quiénes somos"></section>

      <!-- Dedicated Privacidad View -->
      <section class="about-editorial post-view is-hidden" id="privacidad-view" aria-label="Privacidad"></section>

      <!-- Single Post Reading View -->
      <section id="post-view" class="post-view is-hidden" aria-live="polite"></section>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
      <div class="container site-footer__inner">
        <span>Bitácora Oscura, By OdinModding</span>
        <div class="footer-meta">
          <span>Marzo 2026</span>
          <button class="footer-link" id="footer-privacy-btn" type="button">Privacidad</button>
          <div class="footer-socials" aria-label="Redes sociales">
            <a
              href="https://wa.me/"
              target="_blank"
              rel="noopener noreferrer"
              class="social-icon-btn"
              data-cursor="WhatsApp"
              aria-label="WhatsApp"
            >
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
              </svg>
            </a>
            <a
              href="https://instagram.com/"
              target="_blank"
              rel="noopener noreferrer"
              class="social-icon-btn"
              data-cursor="Instagram"
              aria-label="Instagram"
            >
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
                <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
              </svg>
            </a>
          </div>
        </div>
      </div>
    </footer>

    <!-- Lightbox Modal -->
    <div class="modal-backdrop" id="lightbox-modal" role="dialog" aria-modal="true" aria-label="Visor de imagen">
      <button class="modal-close" id="lightbox-close" type="button" aria-label="Cerrar">✕</button>
      <div class="lightbox-content">
        <img id="lightbox-img" src="" alt="" />
        <p class="lightbox-caption" id="lightbox-caption"></p>
      </div>
    </div>

    <!-- PDF.js Dark Canvas Modal -->
    <div class="modal-backdrop" id="pdf-modal" role="dialog" aria-modal="true" aria-label="Visor de documento PDF">
      <button class="modal-close" id="pdf-close" type="button" aria-label="Cerrar">✕</button>
      <div class="pdf-modal-panel">
        <div class="pdf-toolbar">
          <span id="pdf-modal-title" style="font-family:var(--font-display);font-size:1.35rem;">Documento PDF</span>
          <div class="pdf-toolbar__group">
            <button class="btn-glass" id="pdf-prev" type="button">← Ant.</button>
            <span id="pdf-page-info" style="font-family:var(--font-mono);font-size:0.75rem;color:var(--text-secondary);">Cargando…</span>
            <button class="btn-glass" id="pdf-next" type="button">Sig. →</button>
            <button class="btn-glass" id="pdf-zoom-out" type="button">−</button>
            <button class="btn-glass" id="pdf-zoom-in" type="button">+</button>
            <a class="btn-glass is-active" id="pdf-download" href="#" download>Descargar</a>
          </div>
        </div>
        <div class="pdf-canvas-wrap">
          <canvas id="pdf-canvas"></canvas>
        </div>
      </div>
    </div>

    <!-- Command-K Search Modal -->
    <div class="modal-backdrop" id="search-modal" role="dialog" aria-modal="true" aria-label="Búsqueda rápida">
      <div class="search-panel">
        <div class="search-input-wrap">
          <span style="font-family:var(--font-mono);color:var(--accent-bright);">⌘</span>
          <input
            type="search"
            id="search-input"
            class="search-input"
            placeholder="Buscar ensayos, reels o documentos PDF…"
            autocomplete="off"
          />
          <span class="kbd-hint">ESC</span>
        </div>
        <div class="search-results" id="search-results"></div>
      </div>
    </div>

    <script src="./js/data.js" defer></script>
    <script src="./js/media.js" defer></script>
    <script src="./js/interactions.js" defer></script>
    <script src="./js/app.js" defer></script>
  </body>
</html>
